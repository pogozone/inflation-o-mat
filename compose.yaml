services:
  app:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Bitte SECRET_KEY in .env setzen}
      MYSQL_HOST: db
      MYSQL_DATABASE: inflation
      MYSQL_USER: inflation
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Bitte MYSQL_PASSWORD setzen}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: inflation
      MYSQL_USER: inflation
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Bitte MYSQL_PASSWORD setzen}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Bitte MYSQL_ROOT_PASSWORD setzen}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --user=inflation --database=inflation --execute='SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  mysql-data:
